# A listing is accepted only when its title contains every required term and none
# of the excluded terms. Add direct listing URLs below for the most reliable data.
product:
  name: "Apple iPhone 17"
  pincode: "560037"
  required_terms: ["iphone", "17"]
  excluded_terms: ["pro", "pro max", "air", "refurbished", "renewed", "used", "case", "cover", "screen protector"]
  currency: "INR"

schedule:
  minutes: 60
  request_timeout_seconds: 25

scraper:
  browser_fallback: true

retailers:
