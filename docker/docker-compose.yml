# Local development stack.
#
#   docker compose -f docker/docker-compose.yml up -d db
#   docker compose -f docker/docker-compose.yml run --rm migrate
#   docker compose -f docker/docker-compose.yml up api
#
# The worker service is behind a profile until the scheduler lands (phase 5):
#   docker compose -f docker/docker-compose.yml --profile worker up

name: product-tracker

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment:
    DATABASE_URL: postgresql+psycopg://tracker:tracker@db:5432/tracker
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-false}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      # Development-only credentials. Production supplies its own DATABASE_URL.
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: bring the schema up to head, then exit. Run it before api/worker.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command:
      - uvicorn
      - product_tracker.api.app:get_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    profiles: ["worker"]
    command: ["product-tracker", "worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
