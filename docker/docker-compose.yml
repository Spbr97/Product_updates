# Local development stack.
#
#   docker compose -f docker/docker-compose.yml up -d
#
# Brings up PostgreSQL, applies migrations, then starts the API and the worker. Startup is
# ordered by healthchecks, so nothing runs against a database that is not ready or a schema
# that has not been migrated.
#
#   docker compose -f docker/docker-compose.yml logs -f worker
#   docker compose -f docker/docker-compose.yml run --rm migrate
#   docker compose -f docker/docker-compose.yml down -v      # -v also drops the data

name: product-tracker

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://tracker:tracker@db:5432/tracker
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    # The lean image has no browser. Build with EXTRAS=browser and the Playwright base
    # image to enable it; see docker/Dockerfile.
    PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-false}
    API_KEY: ${API_KEY:-}
    NOTIFY_DEFAULT_PROVIDERS: ${NOTIFY_DEFAULT_PROVIDERS:-console}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      # Development-only credentials. Production supplies its own DATABASE_URL.
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      # Bound to the loopback, not 0.0.0.0. Published to every interface, this port
      # hands out the whole database to anyone who can route to the host -- the
      # credentials above are development defaults, and `users` carries api_key_hash
      # with INSERT allowed, so reaching Postgres is a way around the API's auth
      # rather than merely a way past it. Set POSTGRES_PORT to change the host port;
      # to expose it deliberately, write the interface you mean.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: bring the schema to head, then exit. api and worker wait for it to succeed.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command:
      - uvicorn
      - product_tracker.api.app:get_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      # Loopback for the same reason. The API answers 401 without a key, so this is
      # defence in depth rather than the fix for a hole -- but /ui and /health are
      # unauthenticated by design, and a dev stack has no business advertising them
      # to the network. Put a reverse proxy in front of it for a real deployment.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Liveness, not readiness: the container should not be restarted because the
      # database blipped.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    command: ["product-tracker", "worker"]
    restart: unless-stopped
    # Exactly one. APScheduler's job store has no cross-process locking, so a second
    # worker would run every job a second time.
    deploy:
      replicas: 1
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # No HTTP port to probe, so ask the application: `status` exits non-zero when the
      # database is unreachable or unmigrated.
      test: ["CMD-SHELL", "product-tracker status > /dev/null || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
