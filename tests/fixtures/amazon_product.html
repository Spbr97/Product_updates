<!doctype html>
<html><head><title>Samsung Galaxy S25 5G</title></head>
<body>
<!-- Cross-sell tiles come FIRST in the document and carry their own prices. A page-wide
     .a-price selector matches these and reports another product's price entirely. -->
<div id="sims-consolidated-1_feature_div">
  <h1>Add to your order</h1>
  <span class="a-price"><span class="a-offscreen">₹61,480.00</span></span>
  <span class="a-price"><span class="a-offscreen">₹1,299.00</span></span>
</div>

<h1 id="title"><span id="productTitle">
  Samsung Galaxy S25 5G (Silver Shadow, 12GB RAM, 128GB Storage)
</span></h1>

<div id="corePriceDisplay_desktop_feature_div">
  <!-- Amazon leads with an empty a-offscreen node; the real price is the next one. -->
  <span class="a-price"><span class="a-offscreen"></span></span>
  <span class="a-price"><span class="a-offscreen">₹84,999</span></span>
</div>

<div id="availability"><span class="a-color-success">In stock</span></div>
<img id="landingImage" src="https://m.media-amazon.com/images/I/s25.jpg">
</body></html>
