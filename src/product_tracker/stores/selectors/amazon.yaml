# CSS selectors for Amazon India product pages.
#
# Selectors are listed most-specific first; the first one that matches wins.
#
# The single most important thing in this file is what is NOT here: a bare
# `.a-price .a-offscreen`. It is the obvious selector, it matches on every Amazon page,
# and on a real Galaxy S25 listing it returns Rs 61,480 -- the price of a "customers also
# bought" tile, on a phone that costs Rs 84,999. Amazon puts fifteen of them on a page.
#
# So every price selector below is anchored to the buy-box container. If Amazon renames
# those containers the price is simply not found, which is the correct failure: we report
# that we could not read a price rather than reporting a confident wrong one.

name:
  - "#productTitle"
  - "#title span"
  - 'meta[name="title"]'

# Fallbacks only. The price is normally read by read_price_to_pay() in amazon.py, which
# understands that Amazon splits the payable price across .a-price-whole/.a-price-fraction
# and leaves its .a-offscreen empty.
#
# Every selector here excludes .a-text-price, which is the struck-out MRP. Without that
# exclusion the buy box yields the MRP -- Rs 84,999 for a phone selling at Rs 61,480 --
# and a plausible-looking wrong price is far worse than none.
price:
  - "#corePrice_feature_div span.a-price:not(.a-text-price) .a-offscreen"
  - "#corePriceDisplay_desktop_feature_div span.a-price:not(.a-text-price) .a-offscreen"
  - "#apex_desktop span.a-price:not(.a-text-price) .a-offscreen"
  - "#corePriceDisplay_mobile_feature_div span.a-price:not(.a-text-price) .a-offscreen"
  # Older single-node layouts.
  - "#priceblock_ourprice"
  - "#priceblock_dealprice"
  - "#priceblock_saleprice"

# Amazon states stock in words rather than by the presence of a marker element, so the
# adapter reads this block's text instead of treating a match as a verdict.
availability_text:
  - "#availability"
  - "#availabilityInsideBuyBox_feature_div"

# Present only when Amazon has decided the item cannot be bought right now.
out_of_stock:
  - "#outOfStock"

image:
  - "#landingImage"
  - "#imgBlkFront"
  - 'meta[property="og:image"]'

# The ASIN lives in the path (/dp/B0H3FN92VB), not in a query parameter.
identifier_path_pattern: "/(?:dp|gp/product|product)/([A-Z0-9]{10})"
