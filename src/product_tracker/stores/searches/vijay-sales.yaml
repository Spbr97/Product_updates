# Vijay Sales search results.
#
# Verified 2026-09-01: /search?q= returns 200 but the results grid is client-rendered, so
# a plain fetch finds nothing. Kept, rather than deleted, so the store is named in the
# "could not answer" list instead of silently missing -- and so that when the selectors
# below are filled in, nothing else has to change.
#
# The card and field selectors are unverified. Search reports PAGE_STRUCTURE rather than
# "no such product", which is the honest answer for a page we cannot read.

url: "https://www.vijaysales.com/search?q={query}"

product_url_pattern: "/p/[0-9]"

result_card: "div.product-card"

result_link:
  - "a[href*='/p/']"

title:
  - "h3"
  - "div.product-title"

price:
  - "span.discounted-price"
  - "div.price"
