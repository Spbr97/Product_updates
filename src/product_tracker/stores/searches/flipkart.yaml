# Flipkart search results.
#
# The result block is the product link itself, not a container class. Flipkart's class
# names are obfuscated and rotate -- every selector guessed for this file from an earlier
# page had already stopped matching by the next day -- whereas "an anchor whose href
# contains /p/itm" is the URL shape and does not move.
#
# When extraction starts failing, update the class names below. No Python change needed.

# NOTE: robots.txt says `Disallow: /search?`, so this URL is never fetched -- the
# search reports DISALLOWED. It stays here because it is the store's real search URL
# and the selectors below are verified; if Flipkart ever permits it, nothing else
# changes. Discovery happens through the sitemap instead.
url: "https://www.flipkart.com/search?q={query}"

# No sitemap route either, and it is worth writing down why. Flipkart advertises six
# product *indexes*, and each one lists about 599 gzipped child sitemaps -- roughly 3,600
# files covering an entire marketplace. Sitemaps are built for a crawler that walks the lot
# over weeks, not for looking one product up: fetching the twenty files a cap would allow
# samples half a percent of the catalogue at random and answers "not found" for almost
# everything. Better to say we cannot look than to look somewhere useless and report a
# confident absence.
sitemap: "none"

product_url_pattern: "/p/itm"

# The anchor wraps the whole result, title and price included.
result_card: "a[href*='/p/itm']"

result_link:
  - "a[href*='/p/itm']"

# Verified 2026-09-01. Older generations kept below: a selector that no longer matches
# costs nothing, a missing one costs a broken search.
title:
  - "div.RG5Slk"
  - "div.KzDlHZ"
  - "a.wjcEIp"
  - "div._4rR01T"

# ONLY the selling price. A Flipkart card also carries "Upto Rs 54,400 Off on Exchange"
# in div.HZ0E6r -- a number *lower* than the price, so a wrong selector here does not look
# wrong, it looks like a bargain. That class is deliberately absent and must stay absent.
price:
  - "div.hZ3P6w"
  - "div.Nx9bqj"
  - "div._30jeq3"
