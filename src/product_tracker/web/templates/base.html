<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Product Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/ui/static/app.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.12/htmx.min.js"
            integrity="sha512-ntjnDCXeCcNGSZ0RS9uNCPpQfoBiIryQr8Ncb9DKPqIQlEDXWZ2xNqPuBOhwiJgbtn0M3xnkGRWZbBIrRWaVJQ=="
            crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="/ui/products">Product Tracker</a>
      <nav>
        <a href="/ui/products">Products</a>
        <a class="primary" href="/ui/products/new">Add product</a>
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="foot">
      <p>
        Prices and stock are read from each shop separately. A shop we could not read is
        reported as unreadable &mdash; never as out of stock.
      </p>
    </footer>
  </body>
</html>
